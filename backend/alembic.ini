# A generic Alembic configuration file.
# Refer to the Alembic documentation for complete details.

[alembic]
# path to migration scripts
script_location = alembic

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path entries, comma separated
# prepend_sys_path = .

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S

# sqlalchemy.url = driver://user:pass@localhost/dbname
# Example for your project, ensure this matches how you load/use DATABASE_URL from config.py
# For this example, we'll hardcode the placeholder. In a real setup, env.py often loads this from config.
sqlalchemy.url = mysql+mysqlclient://root:password@localhost:3306/autonomous_agent_db
# If your env.py is set up to read from config.py, you might comment out the above line
# and ensure env.py does something like:
# from backend.config import DATABASE_URL
# config.set_main_option('sqlalchemy.url', DATABASE_URL)

# Other options:
# Các tùy chọn khác:
# timezone = UTC
# revision_environment = false
# output_encoding = utf-8
# sourceless = false
# version_table_schema =
# user_module_prefix = alembic.
# render_as_batch = false
# compare_type = false
# compare_server_default = false
# literal_binds = false
# include_schemas = false
# transaction_per_migration = false
# generate_comments = true
